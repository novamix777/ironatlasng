*, *::before, *::after {

.nav-links {

.nav-link {

  letter-spacing: 2px;
  text-transform: uppercase;

}

.nav-link::after {

  bottom: 0;
  left: 0;
  width: 100%;
  height: 1.5px;
  background: linear-gradient(90deg, var(--crimson), var(--gold));

  transform-origin: right;

}

}

.search-hint {

.hint-chip {

  letter-spacing: 0.8px;
}

.hint-chip:hover {
  color: #fff;
  border-color: var(--crimson);
  background: rgba(255, 0, 60, 0.2);
}

.counter-bar {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: clamp(1rem, 2.5vw, 2.5rem);
  padding: 0.7rem 1.8rem;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 99px;
  margin-bottom: clamp(2.5rem, 5vw, 3.5rem);
  font-size: 0.75rem;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-secondary);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
}

.counter-item { display: inline-flex; align-items: center; gap: 0.5rem; }
.counter-item .value { color: #fff; font-weight: 700; font-family: 'Orbitron', sans-serif; }
.counter-divider { width: 1px; height: 12px; background: rgba(255, 255, 255, 0.1); }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr));
  gap: clamp(1.2rem, 2.5vw, 2rem);
  width: 100%;
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 20px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.4s var(--ease-lux), border-color 0.4s ease, box-shadow 0.4s ease;
  position: relative;
  box-shadow: 0 14px 35px rgba(0, 0, 0, 0.5);
  transform-style: preserve-3d;
  will-change: transform;
}

.card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(300px circle at var(--mx, 50%) var(--my, 50%), rgba(255, 0, 60, 0.15), transparent 70%);
  opacity: 0;
  transition: opacity 0.35s ease;
  pointer-events: none;
}

.card:hover::before { opacity: 1; }

.card:hover {
  border-color: var(--crimson);
  box-shadow: 0 22px 50px rgba(255, 0, 60, 0.3), 0 0 25px rgba(255, 0, 60, 0.15);
  transform: translate3d(0, -6px, 0);
}

.thumb {
  position: relative;
  aspect-ratio: 1/1;
  overflow: hidden;
  background: #040103;
}

.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.6s var(--ease-lux), filter 0.4s ease;
}

.card:hover .thumb img {
  transform: scale(1.08);
  filter: saturate(1.2);
}

.thumb-grad {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(10, 0, 2, 0.95) 0%, rgba(10, 0, 2, 0.3) 50%, transparent 100%);
  pointer-events: none;
}

.id-pill {

  left: 0.8rem;

.card-username {

.card-btn {

.card:hover .card-btn {

.empty {

}

.highlight {

  padding: 0 0.2em;

.reveal {

.to-top {

.to-top.show { opacity: 1; transform: translate3d(0, 0, 0); pointer-events: auto; }

@media (max-width: 900px) {

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  #bg-3d-canvas { display: none; }
}
</style>

      <span class="value" id="cnt">0</span>
    </span>
    <span class="counter-divider" aria-hidden="true"></span>
    <span class="counter-item">
      <span>Total</span>
      <span class="value" id="total">0</span>
    </span>
    <span class="counter-divider" aria-hidden="true"></span>
    <span class="counter-item">
      <span>Estado</span>
      <span class="value" id="status" style="color:var(--crimson);">ACTIVO</span>
    </span>
  </div>

  <div class="grid" id="grid" role="list"></div>
</main>

<button class="to-top" id="to-top" aria-label="Volver arriba" type="button">↑</button>

<script>
(function(){
'use strict';

try { if (window.top !== window.self) { window.top.location = window.self.location; } } catch (e) { document.documentElement.style.display = 'none'; }

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');
const safeURL = raw => { try { const u = new URL(raw, location.origin); if (/^https?:$/.test(u.protocol) || u.protocol === location.protocol) return u.href; } catch(_){} return '#'; };

const BASE = '/expuestos/';
const DATA = [
  {id:'7293647496',nombre:'Extαsys',username:'@extasys777',foto:'https://i.postimg.cc/d190XdWR/extasis.jpg',archivo:'extasys.html'},
  {id:'8343472857',nombre:'MR DOX',username:'@Mraxi0',foto:'https://i.postimg.cc/FRdkZws2/brujo.webp',archivo:'brujo.html'},
  {id:'8386551172',nombre:'꧁༺Melo༻꧂',username:'@MALOCOLL',foto:'https://i.postimg.cc/SsXyn5Y3/melito.jpg',archivo:'melo.html'},
  {id:'8392768082',nombre:'Timmy',username:'@Timmyx117',foto:'https://i.postimg.cc/HsFwD4FD/photo-2026-08-13-23-37-50.jpg',archivo:'tymmy.html'},
  {id:'1959256229',nombre:'KING VIP',username:'@KING7ADX',foto:'https://i.postimg.cc/sxM527bX/photo-2026-07-13-23-52-18.jpg',archivo:'king.html'},
  {id:'5238277683',nombre:'𝕸𝖆𝖝 𝕺𝖘𝖆𝖒𝖆',username:'@Maxnotbabe',foto:'https://i.postimg.cc/tC1J2DV4/MAXOSAMA.jpg',archivo:'maxosama.html'},
  {id:'8176358382',nombre:'Joker Col Respaldo',username:'@Jokercol2resp',foto:'https://i.postimg.cc/BbPpHj2v/jokerr.jpg',archivo:'joker.html'},
  {id:'7315919568',nombre:'El Botigas',username:'@TODOfast444',foto:'https://i.postimg.cc/jjW1QB8N/botigas.jpg',archivo:'botigas.html'},
  {id:'8051623211',nombre:'𝖀𝖘𝖊𝖗𝖕𝖆𝖘𝖘𝖓𝖊𝖖𝖚𝖎',username:'@USERPASSNEQUI2',foto:'https://i.postimg.cc/L88tyMHd/Captura-de-pantalla-2026-07-04-001914.png',archivo:'usserpassnequi.html'},
  {id:'5269062657',nombre:'Ramirez E X E',username:'@SrRamirezz',foto:'https://i.postimg.cc/TPPnb4pK/ramirez.jpg',archivo:'ramirez.html'},
  {id:'8178082276',nombre:'Gatsby171',username:'@G4TSBY171',foto:'https://i.postimg.cc/t40S9xzG/gatsby.jpg',archivo:'gatsby.html'},
  {id:'8551203026',nombre:'Yei777',username:'@yei777moneyyy',foto:'https://i.postimg.cc/FzbtfDFs/photo-2025-11-25-07-01-55.jpg',archivo:'yei777.html'},
  {id:'1609732536',nombre:'Yuranys',username:'@Yuranyss',foto:'https://i.postimg.cc/nrKP0rQS/yuranisssssssssssss.jpg',archivo:'yuranis.html'},
  {id:'8491972019',nombre:'zpeqno on',username:'@zconchita',foto:'https://i.postimg.cc/ZnTx4Q5c/Captura-de-pantalla-2026-04-08-004755.png',archivo:'zpeqno.html'},
  {id:'5231380522',nombre:'.40 glock edicion especial',username:'@HBxPP2000',foto:'https://i.postimg.cc/VsSMM2cJ/40GLOCK.jpg',archivo:'40glock.html'},
  {id:'8477619369',nombre:'Dev',username:'@devcrackpy',foto:'https://i.postimg.cc/Rh8NpC5q/DEV.jpg',archivo:'dev.html'},
  {id:'8768231510',nombre:'MR-/BAN HELL',username:'@mrban01',foto:'https://i.postimg.cc/NFh0RJ1n/mrban.jpg',archivo:'mrban.html'},
  {id:'7952283528',nombre:'Hector Lopez',username:'@oihechl',foto:'https://i.postimg.cc/XNFqnWW3/hector.jpg',archivo:'hector.html'}
];

DATA.forEach(e => {
  e._id = e.id;
  e._name = e.nombre.toLowerCase();
  e._user = e.username.toLowerCase().replace('@','');
});

const grid = document.getElementById('grid');
const searchEl = document.getElementById('search');
const clrBtn = document.getElementById('clr');
const cntEl = document.getElementById('cnt');
const totalEl = document.getElementById('total');
const searchHint = document.getElementById('search-hint');

if (totalEl) totalEl.textContent = DATA.length;

function go(archivo){
  const safe = safeURL(BASE + archivo);
  if (safe !== '#') location.href = safe;
}

function highlightMatch(text, query){
  if (!query) return esc(text);
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return esc(text);
  return esc(text.slice(0, idx)) +
    '<span class="highlight">' + esc(text.slice(idx, idx + query.length)) + '</span>' +
    esc(text.slice(idx + query.length));
}

function buildCard(exp, query){
  const art = document.createElement('article');
  art.className = 'card';
  art.setAttribute('role','listitem');
  art.setAttribute('tabindex','0');

  const safeImg = safeURL(exp.foto);

  art.innerHTML =
    '<div class="thumb">' +
      '<img src="' + esc(safeImg) + '" alt="' + esc(exp.nombre) + '" loading="lazy" decoding="async">' +
      '<div class="thumb-grad"></div>' +
      '<span class="id-pill">' + highlightMatch(exp.id, query) + '</span>' +
      '<span class="status-dot" aria-hidden="true"></span>' +
    '</div>' +
    '<div class="card-body">' +
      '<div class="card-name">' + highlightMatch(exp.nombre, query) + '</div>' +
      '<div class="card-username">' + highlightMatch(exp.username, query) + '</div>' +
      '<button class="card-btn" type="button">Ver Expediente <span class="arrow">→</span></button>' +
    '</div>';

  art.addEventListener('click', () => go(exp.archivo));
  art.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(exp.archivo); }
  });
  return art;
}

function render(list, query){
  grid.innerHTML = '';
  if (cntEl) cntEl.textContent = list.length;
  if (!list.length) {
    const d = document.createElement('div');
    d.className = 'empty';
    d.innerHTML = '<div class="empty-icon">∅</div><p>Sin resultados disponibles</p>';
    grid.appendChild(d);
    return;
  }
  const f = document.createDocumentFragment();
  list.forEach(exp => f.appendChild(buildCard(exp, query)));
  grid.appendChild(f);
}

function filter(term){
  if (!term) return DATA;
  const q = term.toLowerCase().trim();
  const qNum = q.replace(/\D/g,'');
  return DATA.filter(e => e._id.includes(q) || (qNum && e._id.includes(qNum)) || e._name.includes(q) || e._user.includes(q));
}

let dbt;
searchEl.addEventListener('input', function(){
  const q = this.value.trim();
  clrBtn.style.display = q ? 'flex' : 'none';
  clearTimeout(dbt);
  dbt = setTimeout(() => render(filter(q), q), 50);
});

clrBtn.addEventListener('click', function(){
  searchEl.value = '';
  this.style.display = 'none';
  render(DATA, '');
  searchEl.focus();
});

if (searchHint) {
  searchHint.addEventListener('click', function(e){
    const chip = e.target.closest('.hint-chip');
    if (!chip) return;
    const hint = chip.dataset.hint || '';
    searchEl.value = hint === 'ID' ? '8' : (hint === 'nombre' ? 'a' : '@');
    searchEl.focus();
    render(filter(searchEl.value), searchEl.value);
    clrBtn.style.display = 'flex';
  });
}

const mobileMenuBtn = document.getElementById('mobile-menu');
const navLinksEl = document.getElementById('nav-links');
if (mobileMenuBtn && navLinksEl) {
  mobileMenuBtn.addEventListener('click', () => {
    const open = navLinksEl.classList.toggle('active');
    mobileMenuBtn.classList.toggle('active', open);
    mobileMenuBtn.setAttribute('aria-expanded', String(open));
  });
  navLinksEl.addEventListener('click', (e) => {
    if (e.target.classList.contains('nav-link')) {
      navLinksEl.classList.remove('active');
      mobileMenuBtn.classList.remove('active');
      mobileMenuBtn.setAttribute('aria-expanded', 'false');
    }
  });
}

const topNav = document.getElementById('top-nav');
const toTop = document.getElementById('to-top');
const scrollLine = document.getElementById('scroll-line');
let ticking = false;

window.addEventListener('scroll', () => {
  if (!ticking) {
    ticking = true;
    requestAnimationFrame(() => {
      const y = window.scrollY;
      const max = document.documentElement.scrollHeight - window.innerHeight;
      const pct = max > 0 ? (y / max) * 100 : 0;
      if (scrollLine) scrollLine.style.width = pct + '%';
      if (topNav) topNav.classList.toggle('scrolled', y > 30);
      if (toTop) toTop.classList.toggle('show', y > 400);
      ticking = false;
    });
  }
}, { passive: true });

if (toTop) toTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

const pageTitle = document.getElementById('page-title');
if (pageTitle) {
  const text = pageTitle.textContent.trim();
  pageTitle.textContent = '';
  const frag = document.createDocumentFragment();
  for (let i = 0; i < text.length; i++) {
    const span = document.createElement('span');
    span.className = text[i] === ' ' ? 'letter space' : 'letter';
    span.textContent = text[i] === ' ' ? '\u00A0' : text[i];
    span.style.animationDelay = (0.04 * i) + 's';
    frag.appendChild(span);
  }
  pageTitle.appendChild(frag);
}

const revealEls = document.querySelectorAll('.reveal');
if ('IntersectionObserver' in window) {
  const obs = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        obs.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });
  revealEls.forEach((el) => obs.observe(el));
} else {
  revealEls.forEach((el) => el.classList.add('visible'));
}

const canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
document.querySelectorAll('.card').forEach((card) => {
  if (canHover) {
    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      card.style.setProperty('--mx', x + 'px');
      card.style.setProperty('--my', y + 'px');
      const rx = ((y - rect.height / 2) / (rect.height / 2)) * -6;
      const ry = ((x - rect.width / 2) / (rect.width / 2)) * 6;
      card.style.transform = `translate3d(0, -6px, 0) rotateX(${rx}deg) rotateY(${ry}deg)`;
    }, { passive: true });
    card.addEventListener('mouseleave', () => { card.style.transform = ''; });
  }
});

render(DATA, '');

const canvas3d = document.getElementById('bg-3d-canvas');
const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!canvas3d || prefersReduced || typeof THREE === 'undefined') return;

const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 768;
const isLowEnd = isMobile || (navigator.hardwareConcurrency || 4) <= 4;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0002, 0.014);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.z = 34;

const renderer = new THREE.WebGLRenderer({ canvas: canvas3d, alpha: true, antialias: false, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(isLowEnd ? 1 : Math.min(window.devicePixelRatio, 1.5));

function createSnowTexture() {
  const c = document.createElement('canvas');
  c.width = 32; c.height = 32;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.4, 'rgba(255,255,255,0.7)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 32, 32);
  return new THREE.CanvasTexture(c);
}

const snowTex = createSnowTexture();
const snowCount = isLowEnd ? 200 : 450;
const snowGeo = new THREE.BufferGeometry();
const snowPos = new Float32Array(snowCount * 3);
const snowCol = new Float32Array(snowCount * 3);
const snowVel = new Float32Array(snowCount);
const snowDrift = new Float32Array(snowCount);

for (let i = 0; i < snowCount; i++) {
  snowPos[i * 3] = (Math.random() - 0.5) * 90;
  snowPos[i * 3 + 1] = (Math.random() - 0.5) * 70;
  snowPos[i * 3 + 2] = (Math.random() - 0.5) * 50;
  snowVel[i] = 0.035 + Math.random() * 0.06;
  snowDrift[i] = Math.random() * Math.PI * 2;
  snowCol[i * 3] = 1.0; snowCol[i * 3 + 1] = 0.95; snowCol[i * 3 + 2] = 0.98;
}

snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
snowGeo.setAttribute('color', new THREE.BufferAttribute(snowCol, 3));

const snowMat = new THREE.PointsMaterial({
  size: isLowEnd ? 0.5 : 0.4,
  map: snowTex,
  vertexColors: true,
  transparent: true,
  opacity: 0.85,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const snowSystem = new THREE.Points(snowGeo, snowMat);
scene.add(snowSystem);

let mouseX = 0, mouseY = 0, currentX = 0, currentY = 0;
window.addEventListener('mousemove', (e) => {
  mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
  mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
}, { passive: true });

let running = true;
let lastTime = performance.now();

function animate(now) {
  if (!running) return;
  requestAnimationFrame(animate);

  const dt = Math.min((now - lastTime) / 16.667, 2.5);
  lastTime = now;

  const positions = snowGeo.attributes.position.array;
  const t = now * 0.001;
  for (let i = 0; i < snowCount; i++) {
    const idx = i * 3;
    positions[idx + 1] -= snowVel[i] * dt * 1.5;
    positions[idx] += Math.sin(t + snowDrift[i]) * 0.012 * dt + mouseX * 0.015 * dt;
    if (positions[idx + 1] < -35) {
      positions[idx + 1] = 38;
      positions[idx] = (Math.random() - 0.5) * 90;
    }
  }
  snowGeo.attributes.position.needsUpdate = true;

  currentX += (mouseX - currentX) * 0.05 * dt;
  currentY += (mouseY - currentY) * 0.05 * dt;

  camera.position.x = currentX * 2.5;
  camera.position.y = -currentY * 2;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}

requestAnimationFrame(animate);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}, { passive: true });

const observer = new MutationObserver((mutations) => {
  for (let i = 0; i < mutations.length; i++) {
    const m = mutations[i];
    if (m.type === 'childList') {
      for (let j = 0; j < m.addedNodes.length; j++) {
        const node = m.addedNodes[j];
        if (node.nodeType === 1 && node.tagName === 'SCRIPT' && !node.hasAttribute('data-allowed')) {
          node.remove();
        }
      }
    }
  }
});
observer.observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
</body>
