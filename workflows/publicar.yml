name: publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Espejar
        env:
          ORIGEN_DATOS: ${{ secrets.ORIGEN_DATOS }}
          MIN_COUNT: "120"
        run: python3 .github/scripts/espejo.py

      - name: Guardarraíl
        run: |
          TAM=$(du -sm mapa/wifi-data | cut -f1)
          echo "dataset: ${TAM} MB"
          if [ "$TAM" -gt 700 ]; then echo "::error::${TAM} MB, sube MIN_COUNT"; exit 1; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.id }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
