<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>.</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>
  :root{
    --fondo:#020005;
    --punto:#ff003c;
    --punto-borde:#ff2d6b;
    --d1:#ffd700; --d2:#ffb000; --d3:#ff5c00; --d4:#ff003c; --d5:#ff00aa;
    --pop-fondo:rgba(12,0,18,.92);
    --pop-borde:rgba(255,0,60,.28);
    --pop-texto:#ffe6ee;
    --pop-clave:#ffd700;
    --pop-tenue:#8a7080;
    --tinte:grayscale(1) invert(1) contrast(.94) brightness(.62) sepia(1) saturate(3) hue-rotate(-12deg);
    --fuente:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--fondo);overflow:hidden}
  #mapa{position:absolute;inset:0;background:var(--fondo)}

  .leaflet-tile-pane{filter:var(--tinte)}
  .leaflet-container{background:var(--fondo);font-family:var(--fuente);outline:none}
  .leaflet-control-attribution{background:rgba(2,0,5,.7)!important;color:#5f4a56!important;
    font-family:var(--fuente)!important;font-size:8px!important;padding:1px 5px!important}
  .leaflet-control-attribution a{color:#8a7080!important}

  .leaflet-popup-content-wrapper{background:var(--pop-fondo);color:var(--pop-texto);
    border:1px solid var(--pop-borde);border-radius:8px;backdrop-filter:blur(14px)}
  .leaflet-popup-content{margin:0;width:230px!important;font-family:var(--fuente);font-size:11px}
  .leaflet-popup-tip{background:var(--pop-fondo);border:1px solid var(--pop-borde)}
  .leaflet-popup-close-button{color:var(--punto)!important;font-size:16px!important;padding:5px 5px 0 0!important}

  .p-cab{padding:8px 10px;border-bottom:1px solid var(--pop-borde);word-break:break-all;
    font-weight:700;color:#fff;font-size:11px}
  .p-cuerpo{padding:8px 10px}
  .p-clave{display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.45);
    border:1px solid var(--pop-borde);border-radius:5px;padding:5px 7px;margin-bottom:7px}
  .p-clave code{flex:1;color:var(--pop-clave);word-break:break-all;font-size:11px}
  .p-clave button{background:transparent;border:1px solid var(--pop-borde);color:var(--punto);
    border-radius:3px;cursor:pointer;padding:1px 6px;font:inherit;font-size:9px;flex:none}
  .p-clave button:hover{background:rgba(255,0,60,.2)}
  .p-com{color:var(--pop-tenue);font-size:10px;margin-bottom:7px;word-break:break-word}
  .p-pie{display:flex;justify-content:space-between;border-top:1px solid rgba(255,0,60,.14);
    padding-top:6px;font-size:9px;color:#5f4a56}
  .p-pie a{color:var(--punto);text-decoration:none;border-bottom:1px dotted rgba(255,0,60,.5)}

  .cl{display:grid;place-items:center;border-radius:50%;color:#fff;font:700 10px/1 var(--fuente);
    background:radial-gradient(circle at 35% 30%,#ff2d6b,#a3002a 78%);
    border:1px solid rgba(255,120,150,.6);box-shadow:0 0 0 3px rgba(255,0,60,.12),0 0 16px rgba(255,0,60,.5)}
</style>
</head>
<body>
<div id="mapa"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
(function(){
  "use strict";

  var CFG = {
    BASE:      "wifi-data/",
    GRID:      0.25,
    MIN_ZOOM:  11,
    TOPE_DENS: 10,
    MAX_TILE:  700,
    MAX_TOTAL: 7000
  };

  var raiz = getComputedStyle(document.documentElement);
  function v(n){ return raiz.getPropertyValue(n).trim(); }

  var mapa = L.map("mapa", {
    center: [26, 8], zoom: 2, minZoom: 2, maxZoom: 19,
    zoomControl: false, attributionControl: false,
    worldCopyJump: true, preferCanvas: true, zoomSnap: .5
  });

  L.control.attribution({ prefix: false, position: "bottomleft" }).addTo(mapa);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: "© OpenStreetMap"
  }).addTo(mapa);

  var lienzo = L.canvas({ padding: .45 });
  var capaDens = L.layerGroup().addTo(mapa);
  var cluster = L.markerClusterGroup({
    maxClusterRadius: 55, disableClusteringAtZoom: 17,
    showCoverageOnHover: false, spiderfyDistanceMultiplier: 1.4, chunkedLoading: true,
    iconCreateFunction: function(c){
      var n = c.getChildCount();
      var d = n >= 500 ? 42 : n >= 100 ? 38 : n >= 25 ? 33 : 28;
      return L.divIcon({
        html: '<div class="cl" style="width:' + d + 'px;height:' + d + 'px">' + n + '</div>',
        className: "", iconSize: L.point(d, d)
      });
    }
  }).addTo(mapa);

  var hechos = Object.create(null), vistos = Object.create(null), indice = [];
  var total = 0, densidad = [];

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" })[c];
    });
  }

  function copiar(txt, btn){
    var ok = function(){
      btn.textContent = "ok";
      setTimeout(function(){ btn.textContent = "copiar"; }, 1100);
    };
    var alt = function(){
      var t = document.createElement("textarea");
      t.value = txt; t.style.position = "fixed"; t.style.opacity = "0";
      document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); ok(); } catch(e){}
      document.body.removeChild(t);
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(ok, alt);
    else alt();
  }

  function popup(r){
    var clave = r.key || "";
    return '<div class="p-cab">' + esc(r.essid || "(oculto)") + '</div>' +
      '<div class="p-cuerpo">' +
      '<div class="p-clave"><code>' + (clave ? esc(clave) : "—") + '</code>' +
      (clave ? '<button type="button" data-copia="' + esc(clave) + '">copiar</button>' : "") + '</div>' +
      (r.comment ? '<div class="p-com">' + esc(r.comment) + '</div>' : "") +
      '<div class="p-pie"><span>' + (+r.lat).toFixed(5) + ", " + (+r.lon).toFixed(5) + '</span>' +
      '<a href="https://www.openstreetmap.org/?mlat=' + r.lat + '&mlon=' + r.lon +
      '#map=18/' + r.lat + '/' + r.lon + '" target="_blank" rel="noopener">ver</a></div></div>';
  }

  function densColors(c){
    if (c >= 10000) return v("--d5");
    if (c >= 500)   return v("--d4");
    if (c >= 100)   return v("--d3");
    if (c >= 20)    return v("--d2");
    return v("--d1");
  }

  function pintarDensidad(){
    capaDens.clearLayers();
    if (mapa.getZoom() > CFG.TOPE_DENS || !densidad.length) return;
    var b = mapa.getBounds().pad(.15);
    for (var i = 0; i < densidad.length; i++){
      var c = densidad[i];
      if (!b.contains([c.lat, c.lon])) continue;
      var col = densColors(c.count);
      L.circleMarker([c.lat, c.lon], {
        renderer: lienzo,
        radius: 3.5 + Math.min(24, Math.log10(c.count + 1) * 4.6),
        color: col, weight: 1, opacity: .8,
        fillColor: col, fillOpacity: .28, interactive: false
      }).addTo(capaDens);
    }
  }

  function cargar(){
    if (mapa.getZoom() < CFG.MIN_ZOOM || total >= CFG.MAX_TOTAL) return;
    var b = mapa.getBounds();
    var sur = Math.max(-89.9, b.getSouth()), norte = Math.min(89.9, b.getNorth());
    var oeste = Math.max(-179.9, b.getWest()), este = Math.min(179.9, b.getEast());
    var pend = 0;
    for (var la = Math.floor(sur / CFG.GRID) * CFG.GRID; la <= norte; la += CFG.GRID){
      for (var lo = Math.floor(oeste / CFG.GRID) * CFG.GRID; lo <= este; lo += CFG.GRID){
        if (pend > 90) return;
        var id = la.toFixed(2) + "_" + lo.toFixed(2);
        if (hechos[id]) continue;
        hechos[id] = 1; pend++; pedir(id);
      }
    }
  }

  function pedir(id){
    fetch(CFG.BASE + "tiles/" + id + ".json", { cache: "force-cache" })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(datos){
        if (!datos || !datos.length) return;
        var nuevos = [], lim = Math.min(datos.length, CFG.MAX_TILE);
        for (var i = 0; i < lim; i++){
          if (total >= CFG.MAX_TOTAL) break;
          var crudo = datos[i];
          var r = Array.isArray(crudo)
            ? { essid: crudo[0], key: crudo[1], comment: crudo[2], lat: +crudo[3], lon: +crudo[4] }
            : crudo;
          if (isNaN(r.lat) || isNaN(r.lon)) continue;
          var k = (+r.lat).toFixed(5) + "," + (+r.lon).toFixed(5);
          if (vistos[k]) continue;
          vistos[k] = 1;
          var m = L.circleMarker([r.lat, r.lon], {
            renderer: lienzo, radius: 5, color: v("--punto-borde"), weight: 1, opacity: .95,
            fillColor: v("--punto"), fillOpacity: .55
          });
          m.bindPopup(popup(r), { maxWidth: 250, minWidth: 230, autoPanPadding: [26, 26] });
          nuevos.push(m); indice.push({ m: m, s: String(r.essid || "").toLowerCase() }); total++;
        }
        if (nuevos.length) cluster.addLayers(nuevos);
      })
      .catch(function(){});
  }

  function refrescar(){ pintarDensidad(); cargar(); }
  mapa.on("moveend", refrescar);
  mapa.on("zoomend", function(){ if (mapa.getZoom() < CFG.MIN_ZOOM) cluster.clearLayers(); refrescar(); });

  document.addEventListener("click", function(e){
    var b = e.target.closest("[data-copia]");
    if (b) copiar(b.getAttribute("data-copia"), b);
  });

  /* ---- puente para tu página ---- */
  function emitir(){
    try {
      parent.postMessage({ mapa: "estado", total: total, zoom: mapa.getZoom() }, "*");
    } catch(e){}
  }
  mapa.on("moveend zoomend", emitir);

  window.addEventListener("message", function(e){
    var d = e.data || {};
    if (d.mapa === "ir" && typeof d.lat === "number")
      mapa.setView([d.lat, d.lon], d.zoom || 16, { animate: true });
    else if (d.mapa === "buscar" && d.q){
      var q = String(d.q).toLowerCase();
      for (var i = 0; i < indice.length; i++){
        if (indice[i].s.indexOf(q) !== -1){
          var m = indice[i].m, ll = m.getLatLng();
          mapa.setView(ll, Math.max(mapa.getZoom(), 16), { animate: true });
          setTimeout(function(){ cluster.zoomToShowLayer(m, function(){ m.openPopup(); }); }, 420);
          break;
        }
      }
    } else if (d.mapa === "reset"){
      mapa.setView([26, 8], 2, { animate: true });
    }
  });

  fetch(CFG.BASE + "density.json", { cache: "force-cache" })
    .then(function(r){ return r.ok ? r.json() : []; })
    .then(function(d){
      densidad = Array.isArray(d) ? d : [];
      if (mapa.getZoom() <= CFG.TOPE_DENS) pintarDensidad();
      cargar(); emitir();
    })
    .catch(function(){});
})();
</script>
</body>
</html>
